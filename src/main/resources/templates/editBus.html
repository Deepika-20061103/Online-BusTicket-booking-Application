<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Edit Bus</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.navbar{
    background:#d84e55;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

.container{
    width:60%;
    margin:40px auto;
}

.card{
    background:white;
    border-radius:10px;
    padding:30px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#d84e55;
    margin-bottom:25px;
}

.btn-update{
    width:100%;
    background:#d84e55;
    color:white;
    border:none;
    padding:12px;
    font-size:18px;
    border-radius:5px;
}

.btn-update:hover{
    background:#b83c43;
}

</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        🚌 TicketGo
    </div>

    <div>
        <a href="/owner">Dashboard</a>
        <a href="/buses">Manage Buses</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="container">

<div class="card">

<h2>Edit Bus</h2>

<form action="/updateBus" method="post">

    <input type="hidden"
           name="busId"
           th:value="${bus.busId}">

    <div class="mb-3">
        <label class="form-label">Bus Name</label>
        <input type="text"
               name="busName"
               class="form-control"
               th:value="${bus.busName}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Source</label>
        <input type="text"
               name="source"
               class="form-control"
               th:value="${bus.source}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Destination</label>
        <input type="text"
               name="destination"
               class="form-control"
               th:value="${bus.destination}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Journey Date</label>
        <input type="date"
               id="journeyDate"
               name="journeyDate"
               class="form-control"
               th:value="${bus.journeyDate}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Departure Time</label>
        <input type="time"
               id="departureTime"
               name="departureTime"
               class="form-control"
               th:value="${bus.departureTime}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Arrival Time</label>
        <input type="time"
               id="arrivalTime"
               name="arrivalTime"
               class="form-control"
               th:value="${bus.arrivalTime}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Fare</label>
        <input type="number"
               name="fare"
               class="form-control"
               th:value="${bus.fare}"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Available Seats</label>
        <input type="number"
               name="availableSeats"
               class="form-control"
               th:value="${bus.availableSeats}"
               required>
    </div>

    <button type="submit" class="btn-update">
        Update Bus
    </button>

</form>

</div>

</div>

<script>

// Prevent selecting a past date
const today = new Date().toISOString().split("T")[0];
document.getElementById("journeyDate").setAttribute("min", today);

// Validate Departure & Arrival Time
const journeyDate = document.getElementById("journeyDate");
const departureTime = document.getElementById("departureTime");
const arrivalTime = document.getElementById("arrivalTime");

function validateTime(){

    if(!journeyDate.value)
        return;

    const now = new Date();
    const todayDate = now.toISOString().split("T")[0];

    if(journeyDate.value === todayDate){

        const currentMinutes =
            now.getHours()*60 + now.getMinutes();

        if(departureTime.value){

            const d = departureTime.value.split(":");

            const depMinutes =
                parseInt(d[0])*60 + parseInt(d[1]);

            if(depMinutes <= currentMinutes){

                alert("Departure time has already passed.");

                departureTime.value="";
            }

        }

        if(arrivalTime.value){

            const a = arrivalTime.value.split(":");

            const arrMinutes =
                parseInt(a[0])*60 + parseInt(a[1]);

            if(arrMinutes <= currentMinutes){

                alert("Arrival time has already passed.");

                arrivalTime.value="";
            }

        }

    }

    if(departureTime.value && arrivalTime.value){

        const d = departureTime.value.split(":");
        const a = arrivalTime.value.split(":");

        const depMinutes =
            parseInt(d[0])*60 + parseInt(d[1]);

        const arrMinutes =
            parseInt(a[0])*60 + parseInt(a[1]);

        if(arrMinutes <= depMinutes){

            alert("Arrival time must be after Departure time.");

            arrivalTime.value="";
        }

    }

}

departureTime.addEventListener("change",validateTime);
arrivalTime.addEventListener("change",validateTime);
journeyDate.addEventListener("change",validateTime);

</script>

</body>
</html>
