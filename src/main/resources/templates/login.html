<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Ticket Booking Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2c3e50,#4ca1af);
}

.login-container{
    width:400px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.login-container h1{
    text-align:center;
    color:#d84e55;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#d84e55;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#d84e55;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.login-btn:hover{
    background:#b63d43;
}

.error{
    color:red;
    text-align:center;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="login-container">

    <h1>Ticket Booking Login</h1>

	<form action="/login" method="post">

	    <input type="hidden" name="busId" th:value="${param.busId}">

	    <label>Username</label>
	    <input type="text" name="username" required>

	    <label>Password</label>
	    <input type="password" name="password" required>
		<div class="text-end mt-2">

		<a href="/forgot-password">

		Forgot Password?

		</a>

		</div>

	    <button type="submit" class="login-btn">
	        Sign In
	    </button>

	</form>

	<div style="text-align:center; margin-top:20px;">
	    <p style="color:#666;">
	        Don't have an account?
	    </p>

		<a th:href="@{/signup(busId=${param.busId})}"
		   style="color:#007bff; font-weight:bold; text-decoration:none;">
		    Sign Up
		</a>
	</div>
	<div th:if="${param.usernotfound}" class="alert alert-danger">
	    Username does not exist.
	</div>

	<div th:if="${param.wrongpassword}" class="alert alert-danger">
	    Incorrect password. Please try again.
	</div>

	<div th:if="${param.resetSuccess}" class="alert alert-success">
	    Password reset successfully. Please login.
	</div>
</div>

</body>
</html>
