<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Reports</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.navbar{
    background:#d84e55;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

.container{
    width:90%;
    margin:40px auto;
}

.heading{
    text-align:center;
    color:#d84e55;
    margin-bottom:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    color:#555;
    margin-bottom:15px;
}

.number{
    font-size:38px;
    color:#d84e55;
    font-weight:bold;
}

.back{
    display:block;
    width:220px;
    margin:40px auto;
    text-align:center;
    background:#d84e55;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
}

.back:hover{
    background:#b63d43;
}

</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        🚌 TicketGo Owner Panel
    </div>

    <div>
        <a href="/owner">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<div class="container">

    <h2 class="heading">📊 System Reports</h2>

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <div class="number" th:text="${totalUsers}">0</div>
        </div>

        <div class="card">
            <h3>Total Buses</h3>
            <div class="number" th:text="${totalBuses}">0</div>
        </div>

        <div class="card">
            <h3>Total Tickets</h3>
            <div class="number" th:text="${totalTickets}">0</div>
        </div>

        <div class="card">
            <h3>Booked Tickets</h3>
            <div class="number" th:text="${bookedCount}">0</div>
        </div>

        <div class="card">
            <h3>Cancelled Tickets</h3>
            <div class="number" th:text="${cancelledCount}">0</div>
        </div>

        <div class="card">
            <h3>Total Revenue</h3>
            <div class="number">
                ₹ <span th:text="${totalRevenue}">0</span>
            </div>
        </div>

    </div>

    <a href="/owner" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
