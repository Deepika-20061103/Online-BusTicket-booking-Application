<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Ticket Booking</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.container{
    width:600px;
    margin:auto;
    background:white;
    padding:25px;
    margin-top:40px;
    box-shadow:0 0 10px gray;
    border-radius:10px;
}
.seat-layout{
    display:grid;
    grid-template-columns:repeat(5,60px);
    gap:12px;
    justify-content:center;
    margin:20px 0;
}

.gap{
    visibility:hidden;
}
.seat.booked {
    background: #d84e55;
    cursor: not-allowed;
    opacity: 0.6;
}
.seat{
    width:50px;
    height:50px;
    background:#4CAF50;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}
.seat{
    width:50px;
    height:50px;
    background:#4CAF50;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    user-select:none;
    transition:0.3s;
}

.seat.selected{
    background:#2196F3;
    transform:scale(1.1);
}

.seat:hover{
    background:#388E3C;
}

.seat.selected{
    background:#2196F3;
}

.seat.booked {
    background: #d84e55;
    cursor: not-allowed;
    opacity: 0.6;
}
h2{
    text-align:center;
    color:#d84e55;
}

label{
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#d84e55;
    color:white;
    font-size:16px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#c0392b;
}

.readonly{
    background:#f1f1f1;
}
</style>
</head>

<body>

<div class="container">

<h2>🎫 Ticket Booking</h2>

<!-- current date/time display -->
<p style="text-align:center;color:#555;font-size:14px;"
   th:text="'Booking as of: ' + ${#temporals.format(now, 'dd-MMM-yyyy HH:mm')}"></p>

<div th:if="${param.error == 'seatBooked'}"
     style="background:#ffe6e6;
            color:#d84e55;
            border:1px solid #d84e55;
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
            text-align:center;
            font-weight:bold;">
    ❌ This seat is already booked. Please choose another seat.
</div>

<!-- past-date validation error -->
<div th:if="${param.error == 'invalidDate'}"
     style="background:#ffe6e6;
            color:#d84e55;
            border:1px solid #d84e55;
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
            text-align:center;
            font-weight:bold;">
    ❌ You can't book for a past date.
</div>

<form th:action="@{/save}" th:object="${ticket}" method="post">

    <label>Bus Name</label>
    <input type="text" th:field="*{busName}" class="readonly" readonly>

    <label>Source</label>
    <input type="text" th:field="*{source}" class="readonly" readonly>

    <label>Destination</label>
    <input type="text" th:field="*{dest}" class="readonly" readonly>


	<label>Journey Date</label>
	<input type="date"
	       th:field="*{journeyDate}"
	       id="journeyDate"
	       th:attr="min=${#temporals.format(today,'yyyy-MM-dd')}">

		   <label>Select Seat</label>

		   <div class="seat-layout">

		       <!-- Row A -->
		       <div class="seat" data-seat="A1">A1</div>
		       <div class="seat" data-seat="A2">A2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="A3">A3</div>
		       <div class="seat" data-seat="A4">A4</div>

		       <!-- Row B -->
		       <div class="seat" data-seat="B1">B1</div>
		       <div class="seat" data-seat="B2">B2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="B3">B3</div>
		       <div class="seat" data-seat="B4">B4</div>

		       <!-- Row C -->
		       <div class="seat" data-seat="C1">C1</div>
		       <div class="seat" data-seat="C2">C2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="C3">C3</div>
		       <div class="seat" data-seat="C4">C4</div>

		       <!-- Row D -->
		       <div class="seat" data-seat="D1">D1</div>
		       <div class="seat" data-seat="D2">D2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="D3">D3</div>
		       <div class="seat" data-seat="D4">D4</div>

		       <!-- Row E -->
		       <div class="seat" data-seat="E1">E1</div>
		       <div class="seat" data-seat="E2">E2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="E3">E3</div>
		       <div class="seat" data-seat="E4">E4</div>

		       <!-- Row F -->
		       <div class="seat" data-seat="F1">F1</div>
		       <div class="seat" data-seat="F2">F2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="F3">F3</div>
		       <div class="seat" data-seat="F4">F4</div>

		       <!-- Row G -->
		       <div class="seat" data-seat="G1">G1</div>
		       <div class="seat" data-seat="G2">G2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="G3">G3</div>
		       <div class="seat" data-seat="G4">G4</div>

		       <!-- Row H -->
		       <div class="seat" data-seat="H1">H1</div>
		       <div class="seat" data-seat="H2">H2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="H3">H3</div>
		       <div class="seat" data-seat="H4">H4</div>

		       <!-- Row I -->
		       <div class="seat" data-seat="I1">I1</div>
		       <div class="seat" data-seat="I2">I2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="I3">I3</div>
		       <div class="seat" data-seat="I4">I4</div>

		       <!-- Row J -->
		       <div class="seat" data-seat="J1">J1</div>
		       <div class="seat" data-seat="J2">J2</div>
		       <div class="gap"></div>
		       <div class="seat" data-seat="J3">J3</div>
		       <div class="seat" data-seat="J4">J4</div>

		   </div>
		   <input type="hidden" th:field="*{seatNo}" id="seatNo">

<input type="hidden" th:field="*{busId}" id="busId">
	<input type="hidden" th:field="*{busName}">
	<input type="hidden" th:field="*{source}">
	<input type="hidden" th:field="*{dest}">

    <button type="submit">Confirm Booking</button>

</form>

<br>

<center>
    <a th:href="@{/tickets}">My Tickets</a>
</center>

</div>
<script th:inline="javascript">

let bookedSeats = /*[[${bookedSeats}]]*/ [];

document.addEventListener("DOMContentLoaded", function () {

    const seats = document.querySelectorAll(".seat");
    const seatInput = document.getElementById("seatNo");
    const dateInput = document.getElementById("journeyDate");

    // Reload booked seats whenever the date changes
    dateInput.addEventListener("change", reloadSeats);

    seats.forEach(seat => {

        let seatNo = seat.dataset.seat;

        if (bookedSeats.includes(seatNo)) {
            seat.classList.add("booked");
            seat.style.pointerEvents = "none";
        }

        seat.addEventListener("click", function () {

            if (this.classList.contains("booked")) {
                return;
            }

            seats.forEach(s => s.classList.remove("selected"));
            this.classList.add("selected");

            seatInput.value = seatNo;
        });

    });

});

function reloadSeats() {

    const date = document.getElementById("journeyDate").value;
    const busId = document.getElementById("busId").value;

    console.log("Selected Date:", date);

    alert(date);

    window.location.href =
        "/booking?busId=" + busId + "&journeyDate=" + date;
}

</script>
</body>
</html>
