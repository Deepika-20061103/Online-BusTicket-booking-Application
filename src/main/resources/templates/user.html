<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>User Management</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

/* Navbar */

.navbar{
    background:#d84e55;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

.navbar a:hover{
    text-decoration:underline;
}

/* Heading */

h2{
    text-align:center;
    color:#d84e55;
    margin:30px 0;
}

/* Table */

.table-container{
    width:95%;
    margin:auto;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

th{
    background:#d84e55;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f8f8f8;
}

/* Delete Button */

.delete-btn{
    background:#dc3545;
    color:white;
    text-decoration:none;
    padding:8px 15px;
    border-radius:5px;
}

.delete-btn:hover{
    background:#b02a37;
}

/* Footer */

.footer{
    text-align:center;
    margin:30px;
}

.footer a{
    text-decoration:none;
    background:#d84e55;
    color:white;
    padding:12px 20px;
    border-radius:6px;
    font-weight:bold;
}

.footer a:hover{
    background:#b63d43;
}

</style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">

    <div class="logo">
        TicketGo
    </div>

    <div>
        <a href="/owner">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<h2>User Management</h2>

<div class="table-container">

<table>

<tr>
    <th>ID</th>
    <th>Username</th>
    <th>Email</th>
    <th>Role</th>
    <th>Created Date</th>
    <th>Action</th>
</tr>

<tr th:each="u : ${users}">

    <td th:text="${u.id}"></td>
    <td th:text="${u.username}"></td>
    <td th:text="${u.email}"></td>
    <td th:text="${u.role}"></td>
    <td th:text="${u.createdDate}"></td>

    <td>
        <a class="delete-btn"
           th:href="@{/delete-user/{id}(id=${u.id})}"
           onclick="return confirm('Are you sure you want to delete this user?')">
            Delete
        </a>
    </td>

</tr>

</table>

</div>

<div class="footer">

    <a href="/owner">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
